<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinhala Subtitle Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try { var th = localStorage.getItem('srt2si:theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
</script>
<style>
:root{
  color-scheme: light;
  --bg:#F1F3F9; --surface:#FFFFFF; --ink:#171B2E; --muted:#59617D; --line:#D9DDEB; --field:#F7F8FC;
  --primary:#3D43C6; --on-primary:#FFFFFF; --focus:#6169F0;
  --screen:#0E1019; --sub-ink:#FFD84A;
  --todo:#B87400; --ok:#17744C; --err:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0D0F1D; --surface:#151830; --ink:#E7E9F8; --muted:#9BA3C7; --line:#2A2F58; --field:#101226;
    --primary:#9AA3FF; --on-primary:#0D0F1D; --focus:#8992FF;
    --screen:#05060B; --sub-ink:#FFD84A;
    --todo:#E8A83A; --ok:#5AD29B; --err:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D0F1D; --surface:#151830; --ink:#E7E9F8; --muted:#9BA3C7; --line:#2A2F58; --field:#101226;
  --primary:#9AA3FF; --on-primary:#0D0F1D; --focus:#8992FF;
  --screen:#05060B; --sub-ink:#FFD84A;
  --todo:#E8A83A; --ok:#5AD29B; --err:#FF8A80;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:72px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.75;
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  counter-reset:step;
}
html[lang=en] body{line-height:1.6}
h1{font-size:1.75rem; line-height:1.4; margin:0 0 8px; font-weight:700}
h2{font-size:1.1rem; line-height:1.5; margin:0; font-weight:700}
p{margin:0 0 10px}
a{color:var(--primary)}
.lead{color:var(--muted); max-width:62ch; margin:0}
.help{color:var(--muted); font-size:.9rem; max-width:64ch}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.skip{position:absolute; left:-9999px; top:8px; background:var(--primary); color:var(--on-primary); padding:8px 14px; border-radius:8px; z-index:50}
.skip:focus{left:12px}

/* step numbers: the content is a real sequence (key, context, file, translate, review) */
.n{
  flex:none; width:26px; height:26px; border-radius:50%;
  display:inline-grid; place-items:center;
  background:var(--primary); color:var(--on-primary);
  font:700 .8rem/1 system-ui,sans-serif;
}
.n::before{counter-increment:step; content:counter(step)}

/* top bar */
.top{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.01em}
.mark{width:30px; height:30px; flex:none}
.mark .m-bg{fill:var(--screen)} .mark .m-ln{fill:var(--sub-ink)}
.tools{display:flex; align-items:center; gap:10px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); flex:none; max-width:100%}
.seg button{
  min-height:38px; padding:0 14px; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:.9rem; font-weight:600; cursor:pointer; white-space:nowrap; line-height:1.4;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--primary); color:var(--on-primary)}
.seg .cnt{font-weight:500; opacity:.8; margin-left:5px; font-variant-numeric:tabular-nums}
.iconbtn{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font:1.15rem/1 system-ui,sans-serif; cursor:pointer;
}
.iconbtn:hover{border-color:var(--primary)}

/* layout */
.layout{max-width:1220px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr)}
.rail{background:var(--surface); border-bottom:1px solid var(--line)}
.work{min-width:0; padding:28px 20px 96px}
@media (min-width:900px){
  .layout{grid-template-columns:390px minmax(0,1fr); gap:0 44px; padding:0 24px}
  .rail{
    position:sticky; top:66px; align-self:start; margin-top:28px;
    max-height:calc(100vh - 90px); overflow:auto;
    border:1px solid var(--line); border-radius:12px;
  }
  .work{padding:28px 0 96px}
}

/* setup panels */
.panel{border-bottom:1px solid var(--line)}
.panel:last-child{border-bottom:0}
.panel > summary{
  list-style:none; display:flex; align-items:center; gap:10px;
  padding:14px 20px; min-height:56px; cursor:pointer;
}
.panel > summary::-webkit-details-marker{display:none}
.panel > summary::after{
  content:""; flex:none; width:8px; height:8px; margin-left:4px;
  border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
  transform:rotate(45deg); transition:transform .15s;
}
.panel[open] > summary::after{transform:rotate(-135deg)}
.panel > .body{padding:0 20px 22px}
.sumchip{flex:1; min-width:0; text-align:right; font-size:.82rem; color:var(--muted); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sumchip[data-kind=ok]{color:var(--ok)}

/* forms */
label{display:block; font-weight:600; margin:16px 0 6px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{
  width:100%; font:inherit; padding:10px 12px; color:var(--ink);
  background:var(--field); border:1px solid var(--line); border-radius:8px;
}
textarea{resize:vertical; min-height:5.5em}
.inline{display:flex; gap:10px; align-items:stretch}
.inline input{flex:1; min-width:0}
.check{display:flex; gap:10px; align-items:flex-start; font-weight:400; margin:14px 0 0}
.check input{margin-top:.55em; width:18px; height:18px; flex:none}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{
  min-height:44px; padding:0 18px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-weight:600; line-height:1.4;
}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn.primary{background:var(--primary); color:var(--on-primary); border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.linkbtn{background:none; border:0; padding:8px 0; color:var(--muted); font:inherit; font-size:.88rem; text-decoration:underline; cursor:pointer}
.linkbtn:hover:not(:disabled){color:var(--ink)}
.linkbtn:disabled{opacity:.4; cursor:not-allowed}
.actions{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px}
.actions .spacer{flex:1}
.msg{min-height:1.75em; margin:10px 0 0; font-size:.95rem}
[data-kind=ok]{color:var(--ok)}
[data-kind=err]{color:var(--err)}

/* workspace sections */
.intro{margin-bottom:6px}
.step{margin-top:32px; padding-top:28px; border-top:1px solid var(--line)}
.step > h2{display:flex; align-items:center; gap:12px}
.drop{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
  margin:16px 0 0; padding:30px 18px; text-align:center; cursor:pointer;
  border:2px dashed var(--line); border-radius:12px; font-weight:400; color:var(--muted);
  background:var(--surface);
}
.drop:hover,.drop.over{border-color:var(--primary); color:var(--ink)}
.drop.over{background:var(--field)}
.drop:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.drop.has{border-style:solid}
.drop input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.drop svg{width:34px; height:34px; margin-bottom:6px; color:var(--primary)}
.drop strong{display:block; color:var(--ink); font-weight:600; word-break:break-all}

/* the subtitle screen */
.screen{
  margin-top:16px; background:var(--screen); color:#fff; border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; min-height:190px;
}
.screen-top{
  display:flex; justify-content:space-between; gap:12px; padding:12px 16px 0;
  font:.75rem/1.4 ui-monospace,Menlo,Consolas,monospace; color:#fff; opacity:.6;
}
.screen-body{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:8px 20px 16px}
.screen-en{text-align:center; font-size:.85rem; line-height:1.5; color:#fff; opacity:.55; white-space:pre-line; min-height:1.5em}
.screen-sub{
  text-align:center; color:var(--sub-ink); font-size:1.3rem; line-height:1.65;
  white-space:pre-line; text-shadow:0 1px 3px rgba(0,0,0,.9); min-height:2.1em;
}
.screen.empty .screen-sub{color:#fff; opacity:.5; font-size:1rem; text-shadow:none}
.scrub{height:6px; background:rgba(255,255,255,.16)}
.scrub i{display:block; height:100%; width:0; background:var(--sub-ink); transition:width .3s}
@media (prefers-reduced-motion: reduce){.scrub i,.panel > summary::after{transition:none}}

.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin:14px 0 0; padding:0;
  background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;
}
.stats > div{background:var(--surface); padding:10px 14px; min-width:0}
.stats dt{font-size:.78rem; color:var(--muted); line-height:1.5}
.stats dd{margin:0; font-size:1.2rem; font-weight:700; line-height:1.5; font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
}

details.log{margin-top:12px; font-size:.88rem; color:var(--muted)}
details.log ul{margin:8px 0 0; padding-left:18px; max-height:180px; overflow:auto}

/* review */
.legend{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.9rem; margin:8px 0 0}
.legend::before{content:""; flex:none; width:3px; height:18px; background:var(--todo); border-radius:2px}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px}
.toolbar input[type=search]{flex:1 1 200px; min-width:0}
.filters{overflow-x:auto}
.rows{margin-top:14px}
.row{
  display:grid; grid-template-columns:minmax(0,1fr); gap:8px 24px;
  padding:14px 0 14px 14px; border-bottom:1px solid var(--line); border-left:3px solid transparent;
}
@media (min-width:720px){.row{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
.row.todo{border-left-color:var(--todo)}
.row.bad{border-left-color:var(--err)}
.meta{font:.78rem/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--muted)}
.en{color:var(--muted); font-size:.92rem; white-space:pre-line; margin:2px 0 0}
.row textarea{min-height:2.9em; field-sizing:content; resize:vertical}
.acts{display:flex; align-items:center; gap:14px; min-height:34px}
.tag{font-size:.75rem; line-height:1.4; padding:1px 8px; border:1px solid var(--todo); color:var(--todo); border-radius:999px}
.rowsempty{color:var(--muted); padding:18px 0}

/* confirm dialog */
dialog{
  width:min(420px,calc(100vw - 32px)); padding:22px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); color:var(--ink);
}
dialog::backdrop{background:rgba(8,10,24,.55)}
dialog p{margin:0 0 4px}
dialog .actions{justify-content:flex-end; margin-top:18px}

.ver{max-width:1220px; margin:0 auto; padding:0 24px 28px; color:var(--muted); font:.78rem/1.4 ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<a class="skip" href="#workspace" data-i18n="skip"></a>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="m-bg" width="32" height="32" rx="8"/><rect class="m-ln" x="6" y="16.5" width="20" height="3.5" rx="1.75"/><rect class="m-ln" x="10" y="22.5" width="12" height="3.5" rx="1.75"/></svg>
    <span>SRT2Si</span>
  </div>
  <div class="tools">
    <div class="seg lang" role="group" aria-label="Language / භාෂාව">
      <button type="button" data-lang="si" lang="si">සිංහල</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button class="iconbtn" id="themeBtn" type="button"></button>
  </div>
</header>

<div class="layout">
  <aside class="rail" aria-label="Setup">
    <details class="panel" id="s-key" open>
      <summary><span class="n" aria-hidden="true"></span><h2>Gemini API key</h2><span class="sumchip" id="sumKey"></span></summary>
      <div class="body">
        <p class="help" data-i18n-html="key.help"></p>
        <label for="apiKey">API key</label>
        <div class="inline">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
          <button class="btn" id="toggleKey" type="button"></button>
        </div>
        <label class="check" for="remember"><input type="checkbox" id="remember"><span data-i18n="key.remember"></span></label>
        <div class="actions"><button class="btn" id="checkKey" type="button" data-i18n="key.check"></button></div>
        <p class="msg" id="keyMsg" role="status" aria-live="polite"></p>
        <label for="model">Model</label>
        <select id="model"><option value="" data-i18n="model.placeholder"></option></select>
        <p class="help" style="margin-top:8px" data-i18n-html="model.help"></p>
        <p class="help" style="margin-top:10px" data-i18n="key.privacy"></p>
      </div>
    </details>

    <details class="panel" id="s-ctx" open>
      <summary><span class="n" aria-hidden="true"></span><h2 data-i18n="ctx.h2"></h2><span class="sumchip" id="sumCtx"></span></summary>
      <div class="body">
        <p class="help" data-i18n="ctx.help"></p>
        <label for="ctxTitle" data-i18n="ctx.title.label"></label>
        <input id="ctxTitle" type="text" data-i18n-ph="ctx.title.ph">
        <label for="ctxChars" data-i18n="ctx.chars.label"></label>
        <textarea id="ctxChars" data-i18n-ph="ctx.chars.ph"></textarea>
        <label for="ctxNotes" data-i18n="ctx.notes.label"></label>
        <textarea id="ctxNotes" data-i18n-ph="ctx.notes.ph"></textarea>
        <label class="check" for="mixEn"><input type="checkbox" id="mixEn" checked><span data-i18n="ctx.mix"></span></label>
      </div>
    </details>

    <details class="panel" id="s-adv">
      <summary><h2 data-i18n="panel.adv"></h2></summary>
      <div class="body">
        <div class="grid2">
          <div>
            <label for="chunkSize" data-i18n="file.chunk"></label>
            <input id="chunkSize" type="number" min="10" max="300" value="100" inputmode="numeric">
          </div>
          <div>
            <label for="gap" data-i18n="file.gap"></label>
            <input id="gap" type="number" min="0" max="120" value="4" inputmode="numeric">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="temp" data-i18n="file.temp"></label>
            <input id="temp" type="number" min="0" max="1" step="0.1" value="0.3" inputmode="decimal">
          </div>
        </div>
        <p class="help" style="margin-top:10px" data-i18n="file.help"></p>
      </div>
    </details>
  </aside>

  <main class="work" id="workspace">
    <div class="intro">
      <h1 data-i18n="app.title">Sinhala Subtitle Translator</h1>
      <p class="lead" data-i18n="app.lead"></p>
    </div>

    <section class="step" id="s-file">
      <h2><span class="n" aria-hidden="true"></span><span data-i18n="file.h2"></span></h2>
      <label class="drop" id="drop" for="fileInput">
        <input id="fileInput" type="file" accept=".srt,text/plain,application/x-subrip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 17v-5"/><path d="m9.5 14.5 2.5-2.5 2.5 2.5"/></svg>
        <strong id="fileName"></strong>
        <span id="fileInfo"></span>
      </label>
    </section>

    <section class="step" id="s-run">
      <h2><span class="n" aria-hidden="true"></span><span data-i18n="run.h2"></span></h2>

      <div class="screen empty" id="now" aria-live="off">
        <div class="screen-top"><span id="nowTime"></span><span id="nowPct">0%</span></div>
        <div class="screen-body">
          <div class="screen-en" id="nowEn" lang="en"></div>
          <div class="screen-sub" id="nowText" lang="si"></div>
        </div>
        <div class="scrub" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap"><i id="bar"></i></div>
      </div>

      <dl class="stats">
        <div><dt data-i18n="stat.done"></dt><dd id="stDone">0 / 0</dd></div>
        <div><dt data-i18n="stat.left"></dt><dd id="stLeft">0</dd></div>
        <div><dt data-i18n="stat.check"></dt><dd id="stBad">0</dd></div>
        <div><dt data-i18n="stat.eta"></dt><dd id="stEta">–</dd></div>
      </dl>

      <div class="actions">
        <button class="btn primary" id="start" type="button" disabled></button>
        <button class="btn" id="stop" type="button" disabled data-i18n="run.stop"></button>
        <button class="btn" id="download" type="button" disabled data-i18n="dl.btn"></button>
        <span class="spacer"></span>
        <button class="linkbtn" id="clear" type="button" disabled data-i18n="run.clear"></button>
      </div>
      <p class="msg" id="status" role="status" aria-live="polite"></p>
      <details class="log"><summary data-i18n="run.log"></summary><ul id="log"></ul></details>
    </section>

    <section class="step" id="s-review" hidden>
      <h2><span class="n" aria-hidden="true"></span><span data-i18n="review.h2"></span></h2>
      <p class="legend" data-i18n="review.legend"></p>
      <p class="help" style="margin-top:6px" data-i18n="review.legend2"></p>
      <div class="toolbar">
        <input id="q" type="search" autocomplete="off" data-i18n-ph="review.search">
        <div class="seg filters" role="group" aria-label="Filter">
          <button type="button" data-f="all" aria-pressed="true"><span data-i18n="filter.all"></span><span class="cnt" id="cAll"></span></button>
          <button type="button" data-f="todo" aria-pressed="false"><span data-i18n="filter.todo"></span><span class="cnt" id="cTodo"></span></button>
          <button type="button" data-f="bad" aria-pressed="false"><span data-i18n="filter.bad"></span><span class="cnt" id="cBad"></span></button>
          <button type="button" data-f="long" aria-pressed="false"><span data-i18n="filter.long"></span><span class="cnt" id="cLong"></span></button>
        </div>
        <button class="btn" id="scan" type="button" data-i18n="review.scan"></button>
      </div>
      <div class="rows" id="rows"></div>
      <p class="rowsempty" id="rowsEmpty" hidden data-i18n="review.empty"></p>
    </section>
  </main>
</div>
<footer class="ver">v6 (2026-09-20)</footer>

<dialog id="dlg">
  <form method="dialog">
    <p id="dlgMsg"></p>
    <div class="actions">
      <button class="btn" id="dlgNo" value="cancel" autofocus></button>
      <button class="btn primary" id="dlgYes" value="ok"></button>
    </div>
  </form>
</dialog>

<script>
'use strict';

// ==CORE START==
function parseSRT(text) {
  text = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const out = [];
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split('\n');
    const ti = lines.findIndex(l => l.indexOf('-->') !== -1);
    if (ti === -1) continue;
    out.push({
      time: lines[ti].trim(),
      lines: lines.slice(ti + 1).map(l => l.trim()).filter(Boolean)
    });
  }
  return out;
}

function buildSRT(entries, tr) {
  return entries.map((e, i) => {
    const id = i + 1;
    const t = tr[id] && String(tr[id]).trim() ? tr[id] : e.lines.join('\n');
    return id + '\n' + e.time + '\n' + t;
  }).join('\n\n') + '\n';
}

function parseModelOutput(text, ids) {
  const allowed = new Set(ids);
  const res = {};
  let cur = null;
  text = String(text || '').replace(/```[a-zA-Z]*\n?/g, '');
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, '');
    const m = line.match(/^\s*(\d+)\s*[|\uFF5C]\s?(.*)$/);
    if (m && allowed.has(+m[1]) && res[+m[1]] === undefined) {
      cur = +m[1];
      res[cur] = m[2].trim();
    } else if (m) {
      cur = null; // a numbered line we did not ask for: stop attaching text to the previous line
    } else if (cur !== null && line.trim() && res[cur].split('\n').length < 3) {
      res[cur] += '\n' + line.trim();
    }
  }
  const out = {};
  for (const k in res) {
    const v = res[k].replace(/ \/ /g, '\n').trim();
    if (v) out[k] = v;
  }
  return out;
}

function retryDelaySeconds(data) {
  const d = (data && data.error && data.error.details) || [];
  for (const x of d) {
    if (x && x.retryDelay) {
      const m = String(x.retryDelay).match(/([\d.]+)s/);
      if (m) return Math.ceil(+m[1]);
    }
  }
  return 0;
}

    '4. Write character names in Sinhala script and spell them consistently.',

    'Tone / extra notes: ' + (c.notes || '(none)')
  ].join('\n');
}

function buildUserPrompt(entries, tr, ids) {
  const first = Math.min.apply(null, ids);
  const prev = [];
  for (let id = first - 1; id >= 1 && prev.length < 5; id--) {
    if (tr[id] && entries[id - 1].lines.length) prev.unshift(id);
  }
  let s = '';
  if (prev.length) {
    s += 'PREVIOUS LINES (for continuity only. Do NOT translate or output them):\n';
    s += prev.map(id => id + '|' + entries[id - 1].lines.join(' / ') + '  =>  ' + String(tr[id]).replace(/\n/g, ' / ')).join('\n');
    s += '\n\n';
  }
  s += 'LINES TO TRANSLATE:\n';
  s += ids.map(id => id + '|' + entries[id - 1].lines.join(' / ')).join('\n');
  return s;
}

// True if the text contains letters from scripts that should never appear in Sinhala subtitles
// (Tamil, Bengali, Arabic, Myanmar, Thai, Korean, CJK ...). Sinhala (0D80-0DFF) and Latin are allowed.
function hasForeignScript(t) {
  return /[\u0370-\u0D7F\u0E00-\u1DFF\u1F00-\u1FFF\u2E80-\uD7FF\uF900-\uFDFF\uFE70-\uFEFF]/.test(String(t || ''));
}

function chunkArray(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

let LANG = 'si';
let THEME = 'auto';
function t(key, vars) {
  let s = (I18N[LANG] && I18N[LANG][key]) || I18N.en[key] || key;
  if (vars) s = s.replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined ? vars[k] : m));
  return s;
}

const $ = id => document.getElementById(id);
const el = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
const API = 'https://generativelanguage.googleapis.com/v1beta';
const LONG_LINE = 48;
const S = {
  entries: [], tr: {}, fileName: '', badFile: null, fp: '', running: false, stop: false, abort: null,
  rows: [], lastReq: 0, saveTimer: null, modelNames: [], st: null, km: null,
  now: null, filter: 'all', t0: 0, d0: 0, runIds: []
};

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

/* ---------- settings ---------- */
const FIELDS = ['ctxTitle', 'ctxChars', 'ctxNotes', 'chunkSize', 'gap', 'temp'];
function loadSettings() {
  FIELDS.forEach(f => { const v = store.get('srt2si:' + f, null); if (v !== null) $(f).value = v; });
  $('mixEn').checked = store.get('srt2si:mixEn', '1') === '1';
  const k = store.get('srt2si:key', '');
  if (k) { $('apiKey').value = k; $('remember').checked = true; }
  const l = store.get('srt2si:lang', 'si');
  LANG = (l === 'en') ? 'en' : 'si';
  const th = store.get('srt2si:theme', 'auto');
  THEME = (th === 'light' || th === 'dark') ? th : 'auto';
}
function saveSettings() {
  FIELDS.forEach(f => store.set('srt2si:' + f, $(f).value));
  store.set('srt2si:mixEn', $('mixEn').checked ? '1' : '0');
  if ($('model').value) store.set('srt2si:model', $('model').value);
  if ($('remember').checked) store.set('srt2si:key', $('apiKey').value.trim());
  else store.del('srt2si:key');
  updateSummaries();
}
function getCtx() {
  return { title: $('ctxTitle').value.trim(), chars: $('ctxChars').value.trim(), notes: $('ctxNotes').value.trim(), mixEnglish: $('mixEn').checked };
}

/* ---------- theme ---------- */
function applyTheme() {
  const r = document.documentElement;
  if (THEME === 'auto') r.removeAttribute('data-theme'); else r.setAttribute('data-theme', THEME);
  const b = $('themeBtn');
  b.textContent = THEME === 'auto' ? '\u25D0\uFE0E' : THEME === 'light' ? '\u2600\uFE0E' : '\u263E\uFE0E';
  b.setAttribute('aria-label', t('theme.' + THEME));
  b.title = t('theme.' + THEME);
}
function cycleTheme() {
  THEME = { auto: 'light', light: 'dark', dark: 'auto' }[THEME];
  store.set('srt2si:theme', THEME);
  applyTheme();
}

/* ---------- language ---------- */
function renderStatus() {
  const s = $('status');
  s.textContent = S.st ? t(S.st.key, S.st.vars) : '';
  s.dataset.kind = (S.st && S.st.kind) || '';
}
function renderKeyMsg() {
  const s = $('keyMsg');
  s.textContent = S.km ? t(S.km.key, S.km.vars) : '';
  s.dataset.kind = (S.km && S.km.kind) || '';
}
function setStatus(key, vars, kind) { S.st = key ? { key, vars, kind } : null; renderStatus(); }
function setKeyMsg(key, vars, kind) { S.km = key ? { key, vars, kind } : null; renderKeyMsg(); }

function updateSummaries() {
  const k = $('apiKey').value.trim(), m = $('model').value;
  const ks = $('sumKey');
  if (m && S.modelNames.length) { ks.textContent = m; ks.dataset.kind = 'ok'; }
  else { ks.textContent = t(k ? 'sum.key.check' : 'sum.key.empty'); ks.dataset.kind = ''; }
  const ti = $('ctxTitle').value.trim();
  const any = ti || $('ctxChars').value.trim() || $('ctxNotes').value.trim();
  $('sumCtx').textContent = ti || t(any ? 'sum.ctx.set' : 'sum.ctx.opt');
}

function modelTag(n) {
  return /lite/.test(n) ? t('tag.lite') : /flash/.test(n) ? t('tag.flash') : /pro/.test(n) ? t('tag.pro') : '';
}
function renderModelOptions() {
  if (!S.modelNames.length) return;
  const sel = $('model'), cur = sel.value;
  sel.textContent = '';
  S.modelNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n + modelTag(n); sel.appendChild(o); });
  if (S.modelNames.indexOf(cur) !== -1) sel.value = cur;
}
function renderFile() {
  const has = S.entries.length > 0 && !S.badFile;
  $('drop').classList.toggle('has', has);
  if (S.badFile) { $('fileName').textContent = S.badFile; $('fileInfo').textContent = t('file.nolines'); return; }
  if (!S.entries.length) { $('fileName').textContent = t('file.drop.title'); $('fileInfo').textContent = t('file.drop.hint'); return; }
  const d = doneCount(), b = badIds().length;
  $('fileName').textContent = S.fileName;
  $('fileInfo').textContent = t('file.info', { n: S.entries.length }) + (d ? t('file.info.done', { d: d }) : '') + (b ? t('file.info.bad', { b: b }) : '');
}
function applyLang() {
  document.documentElement.lang = LANG;
  document.title = t('app.title');
  document.querySelectorAll('[data-i18n]').forEach(e => { e.textContent = t(e.dataset.i18n); });
  document.querySelectorAll('[data-i18n-html]').forEach(e => { e.innerHTML = t(e.dataset.i18nHtml); });
  document.querySelectorAll('[data-i18n-ph]').forEach(e => { e.placeholder = t(e.dataset.i18nPh); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  $('toggleKey').textContent = t($('apiKey').type === 'password' ? 'key.show' : 'key.hide');
  S.rows.forEach((r, i) => {
    r.ta.placeholder = t('row.ph');
    r.ta.setAttribute('aria-label', t('row.aria', { id: i + 1 }));
    r.tag.textContent = t('row.long');
    r.rt.textContent = t('row.redo');
    r.rt.setAttribute('aria-label', t('row.redo.aria', { id: i + 1 }));
  });
  renderModelOptions(); renderStatus(); renderKeyMsg(); updateSummaries(); applyTheme();
  if (S.now) showNow(S.now); else resetNow();
  updateProgress();
}
function setLang(l) {
  LANG = l;
  store.set('srt2si:lang', l);
  applyLang();
}

/* ---------- confirm dialog ---------- */
function ask(msg, yesKey) {
  const d = $('dlg');
  if (typeof d.showModal !== 'function') return Promise.resolve(confirm(msg));
  $('dlgMsg').textContent = msg;
  $('dlgYes').textContent = t(yesKey || 'dlg.ok');
  $('dlgNo').textContent = t('dlg.cancel');
  d.returnValue = '';
  return new Promise(res => {
    d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true });
    d.showModal();
  });
}

/* ---------- small UI helpers ---------- */
function log(msg) {
  const li = document.createElement('li');
  li.textContent = new Date().toLocaleTimeString() + '  ' + msg;
  const ul = $('log'); ul.appendChild(li);
  while (ul.children.length > 60) ul.removeChild(ul.firstChild);
  ul.scrollTop = ul.scrollHeight;
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
async function waitSeconds(sec, key) {
  for (let s = Math.ceil(sec); s > 0; s--) {
    if (S.stop) throw new Error('stopped');
    if (key) setStatus(key, { s: s });
    await sleep(1000);
  }
}
async function gapWait() {
  const gap = Math.max(0, parseFloat($('gap').value) || 0) * 1000;
  const left = S.lastReq + gap - Date.now();
  if (left > 0) await waitSeconds(left / 1000, null);
}
function fmtDuration(sec) {
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
  return Math.floor(sec / 3600) + 'h ' + Math.floor((sec % 3600) / 60) + 'm';
}
function isLong(txt) {
  const ls = String(txt || '').split('\n');
  return ls.length > 2 || ls.some(l => l.length > LONG_LINE);
}

/* ---------- progress / rows ---------- */
function translatable() { return S.entries.filter(e => e.lines.length).length; }
function doneCount() { return S.entries.reduce((n, e, i) => n + (e.lines.length && S.tr[i + 1] ? 1 : 0), 0); }
function todoIds() {
  const r = [];
  S.entries.forEach((e, i) => { if (e.lines.length && !S.tr[i + 1]) r.push(i + 1); });
  return r;
}
function badIds() {
  const r = [];
  S.entries.forEach((e, i) => { if (S.tr[i + 1] && hasForeignScript(S.tr[i + 1])) r.push(i + 1); });
  return r;
}
function longCount() {
  let n = 0;
  S.entries.forEach((e, i) => { if (S.tr[i + 1] && isLong(S.tr[i + 1])) n++; });
  return n;
}
async function scanBad() {
  const bad = badIds();
  if (!bad.length) { setStatus('scan.none', null, 'ok'); return; }
  if (!(await ask(t('scan.confirm', { n: bad.length }), 'scan.ok'))) return;
  bad.forEach(id => { delete S.tr[id]; setRow(id); });
  save(); updateProgress(); applyFilter();
  setStatus('scan.done', { n: bad.length }, 'ok');
}
function etaText() {
  if (!S.running || !S.t0) return '–';
  const done = doneCount() - S.d0;
  if (done <= 0) return '…';
  const left = S.runIds.filter(id => !S.tr[id]).length;
  return fmtDuration(Math.round(((Date.now() - S.t0) / done) * left / 1000));
}
function updateProgress() {
  const t0 = translatable(), d = doneCount();
  const pct = t0 ? Math.round(d / t0 * 100) : 0;
  const bad = badIds().length;
  $('bar').style.width = pct + '%';
  $('barWrap').setAttribute('aria-valuenow', pct);
  $('nowPct').textContent = pct + '%';
  $('stDone').textContent = d + ' / ' + t0;
  $('stLeft').textContent = t0 - d;
  $('stBad').textContent = bad;
  $('stEta').textContent = etaText();
  $('cAll').textContent = t0;
  $('cTodo').textContent = t0 - d;
  $('cBad').textContent = bad;
  $('cLong').textContent = longCount();
  const has = S.entries.length > 0;
  $('start').disabled = !has || S.running;
  $('download').disabled = !has;
  $('clear').disabled = !has || S.running;
  $('scan').disabled = !has || S.running;
  S.rows.forEach(r => { r.rt.disabled = S.running; });
  $('start').textContent = t(d === 0 ? 'run.start.new' : (d < t0 ? 'run.start.resume' : 'run.start.again'));
  renderFile();
}
function setBusy(b) {
  S.running = b;
  $('stop').disabled = !b;
  document.body.setAttribute('aria-busy', String(b));
  updateProgress();
}
function paintRow(id) {
  const r = S.rows[id - 1];
  if (!r) return;
  const v = S.tr[id];
  r.row.classList.toggle('todo', !v && S.entries[id - 1].lines.length > 0);
  r.row.classList.toggle('bad', !!v && hasForeignScript(v));
  r.tag.hidden = !(v && isLong(v));
}
function setRow(id) {
  const r = S.rows[id - 1];
  if (!r) return;
  r.ta.value = S.tr[id] || '';
  paintRow(id);
}
function scheduleSave() {
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(save, 400);
}
function save() { if (S.fp) store.set(S.fp, JSON.stringify(S.tr)); }

function applyFilter() {
  const q = $('q').value.trim().toLowerCase(), f = S.filter;
  let shown = 0;
  S.rows.forEach((r, i) => {
    const id = i + 1, e = S.entries[i], v = S.tr[id];
    let ok = true;
    if (f === 'todo') ok = !v && e.lines.length > 0;
    else if (f === 'bad') ok = !!v && hasForeignScript(v);
    else if (f === 'long') ok = !!v && isLong(v);
    if (ok && q) ok = (e.lines.join(' ') + ' ' + (v || '')).toLowerCase().indexOf(q) !== -1;
    r.row.hidden = !ok;
    if (ok) shown++;
  });
  $('rowsEmpty').hidden = shown > 0 || !S.entries.length;
}

function renderRows() {
  const box = $('rows');
  box.textContent = '';
  S.rows = [];
  const frag = document.createDocumentFragment();
  S.entries.forEach((e, i) => {
    const id = i + 1;
    const row = el('div', 'row');
    const src = el('div', 'src');
    const meta = el('div', 'meta');
    meta.textContent = id + '   ' + e.time.split('-->')[0].trim();
    const en = el('div', 'en'); en.textContent = e.lines.join('\n');
    src.appendChild(meta); src.appendChild(en);
    row.appendChild(src);

    const ta = el('textarea');
    ta.rows = 2; ta.lang = 'si';
    ta.setAttribute('aria-label', t('row.aria', { id: id }));
    const tag = el('span', 'tag'); tag.textContent = t('row.long'); tag.hidden = true;
    const rt = el('button', 'linkbtn'); rt.type = 'button';
    rt.textContent = t('row.redo');
    rt.setAttribute('aria-label', t('row.redo.aria', { id: id }));
    rt.addEventListener('click', () => retranslate(id));
    S.rows.push({ row, ta, tag, rt });

    if (e.lines.length) {
      const dst = el('div', 'dst');
      const acts = el('div', 'acts');
      ta.value = S.tr[id] || '';
      ta.placeholder = t('row.ph');
      ta.addEventListener('focus', () => showNow(id));
      ta.addEventListener('input', () => {
        if (ta.value.trim()) S.tr[id] = ta.value; else delete S.tr[id];
        paintRow(id); showNow(id);
        scheduleSave(); updateProgress();
      });
      acts.appendChild(tag); acts.appendChild(rt);
      dst.appendChild(ta); dst.appendChild(acts);
      row.appendChild(dst);
      paintRow(id);
    }
    frag.appendChild(row);
  });
  box.appendChild(frag);
  $('s-review').hidden = !S.entries.length;
  applyFilter();
}

function resetNow() {
  S.now = null;
  $('now').classList.add('empty');
  $('nowTime').textContent = '';
  $('nowEn').textContent = '';
  $('nowText').textContent = t('screen.empty');
}
function showNow(id) {
  const e = S.entries[id - 1];
  if (!e) return;
  S.now = id;
  const tx = S.tr[id] || '';
  $('now').classList.toggle('empty', !tx);
  $('nowTime').textContent = id + '   ' + e.time.split('-->')[0].trim();
  $('nowEn').textContent = e.lines.join('\n');
  $('nowText').textContent = tx || t('row.ph');
}

/* ---------- file ---------- */
async function handleFile(file) {
  if (!file || S.running) return;
  let text;
  try { text = await file.text(); } catch (e) { setStatus('file.readfail', null, 'err'); return; }
  const entries = parseSRT(text);
  if (!entries.length) { S.badFile = file.name; renderFile(); return; }
  S.badFile = null;
  S.entries = entries; S.fileName = file.name;
  S.fp = 'srt2si:p:' + hashStr(file.name + '|' + entries.length + '|' + entries.map(e => e.lines.join('/')).join('\n'));
  try { S.tr = JSON.parse(store.get(S.fp, '{}')) || {}; } catch (e) { S.tr = {}; }
  resetNow();
  setStatus(null);
  renderRows(); updateProgress();
}

/* ---------- Gemini ---------- */
async function loadModels() {
  const key = $('apiKey').value.trim();
  if (!key) { setKeyMsg('key.needKey', null, 'err'); return false; }
  setKeyMsg('key.checking');
  try {
    const res = await fetch(API + '/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error((data.error && data.error.message) || res.statusText); e.status = res.status; throw e; }
    const score = n => (/lite/.test(n) ? 0 : /flash/.test(n) ? 1 : /pro/.test(n) ? 3 : 2) + (/preview|exp/.test(n) ? 0.5 : 0);
    const names = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).indexOf('generateContent') !== -1)
      .map(m => m.name.replace(/^models\//, ''))
      .filter(n => !/image|tts|live|audio|embedding|aqa|robotics|computer|imagen|veo|learnlm/i.test(n))
      .sort((a, b) => score(a) - score(b) || b.localeCompare(a));
    if (!names.length) { setKeyMsg('key.nomodels', null, 'err'); return false; }
    const prev = $('model').value || store.get('srt2si:model', '');
    S.modelNames = names;
    $('model').textContent = '';
    renderModelOptions();
    $('model').value = names.indexOf(prev) !== -1 ? prev : names[0];
    setKeyMsg('key.ok', { n: names.length }, 'ok');
    saveSettings();
    return true;
  } catch (e) {
    if (e.status === 400 || e.status === 403) setKeyMsg('key.bad', null, 'err');
    else setKeyMsg('key.fail', { msg: e.message }, 'err');
    return false;
  }
}

async function callGemini(model, system, user, temperature) {
  S.lastReq = Date.now();
  S.abort = new AbortController();
  const res = await fetch(API + '/models/' + encodeURIComponent(model) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': $('apiKey').value.trim() },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: user }] }],
      generationConfig: { temperature: temperature },
      safetySettings: ['HARM_CATEGORY_HARASSMENT', 'HARM_CATEGORY_HATE_SPEECH', 'HARM_CATEGORY_SEXUALLY_EXPLICIT', 'HARM_CATEGORY_DANGEROUS_CONTENT']
        .map(c => ({ category: c, threshold: 'BLOCK_NONE' }))
    }),
    signal: S.abort.signal
  });
  S.lastReq = Date.now();
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error((data.error && data.error.message) || res.statusText);
    e.status = res.status; e.data = data;
    throw e;
  }
  const cand = data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('');
  return { text, finish: cand && cand.finishReason, blocked: data.promptFeedback && data.promptFeedback.blockReason };
}

async function requestWithRetry(fn) {
  for (let attempt = 0; attempt < 6; attempt++) {
    if (S.stop) throw new Error('stopped');
    try {
      return await fn();
    } catch (e) {
      if (S.stop || e.name === 'AbortError') throw new Error('stopped');
      if ([400, 401, 403, 404].indexOf(e.status) !== -1) { e.fatal = true; throw e; }
      let wait;
      if (e.status === 429) {
        const raw = JSON.stringify(e.data || {});
        const quotas = (raw.match(/"quotaId":"[^"]+"/g) || []).map(x => x.slice(11, -1)).join(', ');
        log('429: ' + String(e.message || '').slice(0, 300) + (quotas ? ' | ' + quotas : ''));
        if (/"quotaValue":"0"/.test(raw) || /limit:\s*0\b/.test(String(e.message))) { e.noQuota = true; throw e; }
        if (/PerDay/.test(raw) && !/PerMinute/.test(raw)) { e.daily = true; throw e; }
        wait = retryDelaySeconds(e.data) || Math.min(60, 15 * (attempt + 1));
        log(t('log.429', { s: wait }));
        await waitSeconds(wait + 1, 'run.limitwait');
      } else if (e.status >= 500 || e.name === 'TypeError') {
        wait = 5 * (attempt + 1);
        log(t('log.err', { msg: e.message, s: wait }));
        await waitSeconds(wait, 'run.neterr');
      } else {
        throw e;
      }
    }
  }
  throw new Error(t('run.retriesfail'));
}

async function translatePart(ids, attempt) {
  await gapWait();
  if (S.stop) throw new Error('stopped');
  const model = $('model').value.trim();
  const sys = buildSystemPrompt(getCtx());
  const usr = buildUserPrompt(S.entries, S.tr, ids);
  setStatus('run.progress', { a: ids[0], b: ids[ids.length - 1] });
  const base = Math.min(1, Math.max(0, isNaN(parseFloat($('temp').value)) ? 0.3 : parseFloat($('temp').value)));
  const temperature = attempt > 0 ? Math.min(base, 0.1) : base;
  const r = await requestWithRetry(() => callGemini(model, sys, usr, temperature));
  if (r.blocked) log('Blocked: ' + r.blocked);
  const got = parseModelOutput(r.text, ids);
  let n = 0, last = 0, foreign = 0;
  for (const k in got) {
    if (hasForeignScript(got[k])) { foreign++; continue; } // garbled output: leave it untranslated so it is retried
    S.tr[k] = got[k]; setRow(+k); n++; last = Math.max(last, +k);
  }
  if (foreign) log(t('log.foreign', { n: foreign }));
  if (last) showNow(last);
  save(); updateProgress(); applyFilter();
  if (n < ids.length) log(t('log.missing', { n: ids.length - n, why: (r.finish && r.finish !== 'STOP') ? ' (' + r.finish + ')' : '' }));
  return n;
}

async function translateBatch(ids) {
  let pending = ids.slice();
  for (let attempt = 0; attempt < 4 && pending.length; attempt++) {
    const size = attempt === 0 ? pending.length : Math.max(8, Math.ceil(pending.length / (attempt + 1)));
    for (const part of chunkArray(pending, size)) await translatePart(part, attempt);
    pending = pending.filter(id => !S.tr[id]);
  }
  if (pending.length) log(t('log.failed', { n: pending.length }));
}

// run(null) translates every remaining line; run([ids]) translates only those lines
async function run(only) {
  if (S.running) return;
  if (!$('apiKey').value.trim()) { setStatus('run.needKey', null, 'err'); $('apiKey').focus(); return; }
  if (!S.entries.length) { setStatus('run.needFile', null, 'err'); return; }
  saveSettings();
  if (!$('model').value.trim()) {
    const ok = await loadModels();
    if (!ok || !$('model').value.trim()) { setStatus('run.nomodel', null, 'err'); return; }
  }
  const todo = only || todoIds();
  if (!todo.length) { setStatus('run.alldone', null, 'ok'); return; }
  const size = Math.min(300, Math.max(10, parseInt($('chunkSize').value, 10) || 100));
  S.stop = false; S.runIds = todo.slice(); S.t0 = Date.now(); S.d0 = doneCount();
  setBusy(true);
  try {
    for (const batch of chunkArray(todo, size)) await translateBatch(batch);
    const left = only ? only.filter(id => !S.tr[id]).length : todoIds().length;
    if (!left) setStatus('run.finished', null, 'ok');
    else setStatus('run.left', { n: left }, 'err');
  } catch (e) {
    if (e.message === 'stopped') setStatus('run.stopped');
    else if (e.daily) setStatus('run.daily', null, 'err');
    else if (e.noQuota) setStatus('run.noquota', null, 'err');
    else if (e.fatal && e.status === 404) setStatus('run.model404', null, 'err');
    else if (e.fatal) setStatus('run.fatal', { msg: e.message }, 'err');
    else setStatus('run.error', { msg: e.message }, 'err');
    log('Stopped: ' + e.message);
  } finally {
    save(); setBusy(false); applyFilter();
  }
}
function start() { return run(null); }

async function retranslate(id) {
  if (S.running) return;
  if (!$('apiKey').value.trim()) { setStatus('run.needKey', null, 'err'); $('apiKey').focus(); return; }
  const prev = S.tr[id];
  delete S.tr[id]; setRow(id); save(); updateProgress();
  await run([id]);
  if (!S.tr[id] && prev) {
    S.tr[id] = prev; setRow(id); save(); updateProgress();
    setStatus('row.kept', null, 'err');
  }
}

function stop() {
  S.stop = true;
  if (S.abort) S.abort.abort();
}

async function download() {
  const total = translatable(), d = doneCount();
  if (d < total && !(await ask(t('dl.confirm', { n: total - d }), 'dl.ok'))) return;
  const srt = buildSRT(S.entries, S.tr).replace(/\n/g, '\r\n');
  const blob = new Blob(['\uFEFF' + srt], { type: 'application/x-subrip;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (S.fileName || 'subtitles').replace(/\.srt$/i, '') + '.si.srt';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function clearProgress() {
  if (!S.entries.length || !(await ask(t('clear.confirm'), 'clear.ok'))) return;
  S.tr = {}; store.del(S.fp);
  resetNow(); setStatus(null);
  renderRows(); updateProgress();
}

/* ---------- wiring ---------- */
loadSettings();
if (window.matchMedia && window.matchMedia('(max-width:899px)').matches) {
  $('s-ctx').open = false;
  if ($('apiKey').value.trim()) $('s-key').open = false; // remembered key: less scrolling on phones
}
[...FIELDS, 'mixEn', 'remember', 'apiKey', 'model'].forEach(f => $(f).addEventListener('input', saveSettings));
$('model').addEventListener('change', saveSettings);
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('themeBtn').addEventListener('click', cycleTheme);
$('toggleKey').addEventListener('click', () => {
  const k = $('apiKey');
  k.type = k.type === 'password' ? 'text' : 'password';
  $('toggleKey').textContent = t(k.type === 'password' ? 'key.show' : 'key.hide');
});
$('checkKey').addEventListener('click', loadModels);
$('fileInput').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
const dz = $('drop');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
$('download').addEventListener('click', download);
$('clear').addEventListener('click', clearProgress);
$('scan').addEventListener('click', scanBad);
$('q').addEventListener('input', applyFilter);
document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  S.filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyFilter();
}));
window.addEventListener('beforeunload', save);
applyLang();
if ($('apiKey').value.trim()) loadModels(); // a remembered key: have the model list ready
</script>
