<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sinhala Subtitle Translator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
try { var th = localStorage.getItem('srt2si:theme'); if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th); } catch (e) {}
</script>
<style>
:root{
  color-scheme: light;
  --bg:#F1F3F9; --surface:#FFFFFF; --ink:#171B2E; --muted:#59617D; --line:#D9DDEB; --field:#F7F8FC;
  --primary:#3D43C6; --on-primary:#FFFFFF; --focus:#6169F0;
  --screen:#0E1019; --sub-ink:#FFD84A;
  --todo:#B87400; --ok:#17744C; --err:#B3261E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0D0F1D; --surface:#151830; --ink:#E7E9F8; --muted:#9BA3C7; --line:#2A2F58; --field:#101226;
    --primary:#9AA3FF; --on-primary:#0D0F1D; --focus:#8992FF;
    --screen:#05060B; --sub-ink:#FFD84A;
    --todo:#E8A83A; --ok:#5AD29B; --err:#FF8A80;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0D0F1D; --surface:#151830; --ink:#E7E9F8; --muted:#9BA3C7; --line:#2A2F58; --field:#101226;
  --primary:#9AA3FF; --on-primary:#0D0F1D; --focus:#8992FF;
  --screen:#05060B; --sub-ink:#FFD84A;
  --todo:#E8A83A; --ok:#5AD29B; --err:#FF8A80;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-padding-top:72px}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Plus Jakarta Sans","Noto Sans Sinhala","Iskoola Pota","Nirmala UI",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.75;
  padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  counter-reset:step;
}
html[lang=en] body{line-height:1.6}
h1{font-size:1.75rem; line-height:1.4; margin:0 0 8px; font-weight:700}
h2{font-size:1.1rem; line-height:1.5; margin:0; font-weight:700}
p{margin:0 0 10px}
a{color:var(--primary)}
.lead{color:var(--muted); max-width:62ch; margin:0}
.help{color:var(--muted); font-size:.9rem; max-width:64ch}
[hidden]{display:none !important}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
.skip{position:absolute; left:-9999px; top:8px; background:var(--primary); color:var(--on-primary); padding:8px 14px; border-radius:8px; z-index:50}
.skip:focus{left:12px}

/* step numbers: the content is a real sequence (key, context, file, translate, review) */
.n{
  flex:none; width:26px; height:26px; border-radius:50%;
  display:inline-grid; place-items:center;
  background:var(--primary); color:var(--on-primary);
  font:700 .8rem/1 system-ui,sans-serif;
}
.n::before{counter-increment:step; content:counter(step)}

/* top bar */
.top{
  position:sticky; top:0; z-index:20;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 20px 10px;
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:.01em}
.mark{width:30px; height:30px; flex:none}
.mark .m-bg{fill:var(--screen)} .mark .m-ln{fill:var(--sub-ink)}
.tools{display:flex; align-items:center; gap:10px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface); flex:none; max-width:100%}
.seg button{
  min-height:38px; padding:0 14px; border:0; background:transparent; color:var(--ink);
  font:inherit; font-size:.9rem; font-weight:600; cursor:pointer; white-space:nowrap; line-height:1.4;
}
.seg button + button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--primary); color:var(--on-primary)}
.seg .cnt{font-weight:500; opacity:.8; margin-left:5px; font-variant-numeric:tabular-nums}
.iconbtn{
  width:40px; height:40px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
  color:var(--ink); font:1.15rem/1 system-ui,sans-serif; cursor:pointer;
}
.iconbtn:hover{border-color:var(--primary)}

/* layout */
.layout{max-width:1220px; margin:0 auto; display:grid; grid-template-columns:minmax(0,1fr)}
.rail{background:var(--surface); border-bottom:1px solid var(--line)}
.work{min-width:0; padding:28px 20px 96px}
@media (min-width:900px){
  .layout{grid-template-columns:390px minmax(0,1fr); gap:0 44px; padding:0 24px}
  .rail{
    position:sticky; top:66px; align-self:start; margin-top:28px;
    max-height:calc(100vh - 90px); overflow:auto;
    border:1px solid var(--line); border-radius:12px;
  }
  .work{padding:28px 0 96px}
}

/* setup panels */
.panel{border-bottom:1px solid var(--line)}
.panel:last-child{border-bottom:0}
.panel > summary{
  list-style:none; display:flex; align-items:center; gap:10px;
  padding:14px 20px; min-height:56px; cursor:pointer;
}
.panel > summary::-webkit-details-marker{display:none}
.panel > summary::after{
  content:""; flex:none; width:8px; height:8px; margin-left:4px;
  border-right:2px solid var(--muted); border-bottom:2px solid var(--muted);
  transform:rotate(45deg); transition:transform .15s;
}
.panel[open] > summary::after{transform:rotate(-135deg)}
.panel > .body{padding:0 20px 22px}
.sumchip{flex:1; min-width:0; text-align:right; font-size:.82rem; color:var(--muted); line-height:1.4; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sumchip[data-kind=ok]{color:var(--ok)}

/* forms */
label{display:block; font-weight:600; margin:16px 0 6px}
input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{
  width:100%; font:inherit; padding:10px 12px; color:var(--ink);
  background:var(--field); border:1px solid var(--line); border-radius:8px;
}
textarea{resize:vertical; min-height:5.5em}
.inline{display:flex; gap:10px; align-items:stretch}
.inline input,.inline select{flex:1; min-width:0}
.check{display:flex; gap:10px; align-items:flex-start; font-weight:400; margin:14px 0 0}
.check input{margin-top:.55em; width:18px; height:18px; flex:none}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.btn{
  min-height:44px; padding:0 18px; border-radius:8px; cursor:pointer;
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-weight:600; line-height:1.4;
}
.btn:hover:not(:disabled){border-color:var(--primary)}
.btn.primary{background:var(--primary); color:var(--on-primary); border-color:transparent}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.linkbtn{background:none; border:0; padding:8px 0; color:var(--muted); font:inherit; font-size:.88rem; text-decoration:underline; cursor:pointer}
.linkbtn:hover:not(:disabled){color:var(--ink)}
.linkbtn:disabled{opacity:.4; cursor:not-allowed}
.actions{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:14px}
.actions .spacer{flex:1}
.msg{min-height:1.75em; margin:10px 0 0; font-size:.95rem}
[data-kind=ok]{color:var(--ok)}
[data-kind=err]{color:var(--err)}

/* workspace sections */
.intro{margin-bottom:6px}
.step{margin-top:32px; padding-top:28px; border-top:1px solid var(--line)}
.step > h2{display:flex; align-items:center; gap:12px}
.drop{
  position:relative; display:flex; flex-direction:column; align-items:center; gap:2px;
  margin:16px 0 0; padding:30px 18px; text-align:center; cursor:pointer;
  border:2px dashed var(--line); border-radius:12px; font-weight:400; color:var(--muted);
  background:var(--surface);
}
.drop:hover,.drop.over{border-color:var(--primary); color:var(--ink)}
.drop.over{background:var(--field)}
.drop:focus-within{outline:3px solid var(--focus); outline-offset:2px}
.drop.has{border-style:solid}
.drop input{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.drop svg{width:34px; height:34px; margin-bottom:6px; color:var(--primary)}
.drop strong{display:block; color:var(--ink); font-weight:600; word-break:break-all}

/* the subtitle screen */
.screen{
  margin-top:16px; background:var(--screen); color:#fff; border-radius:12px; overflow:hidden;
  display:flex; flex-direction:column; min-height:190px;
}
.screen-top{
  display:flex; justify-content:space-between; gap:12px; padding:12px 16px 0;
  font:.75rem/1.4 ui-monospace,Menlo,Consolas,monospace; color:#fff; opacity:.6;
}
.screen-body{flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:6px; padding:8px 20px 16px}
.screen-en{text-align:center; font-size:.85rem; line-height:1.5; color:#fff; opacity:.55; white-space:pre-line; min-height:1.5em}
.screen-sub{
  text-align:center; color:var(--sub-ink); font-size:1.3rem; line-height:1.65;
  white-space:pre-line; text-shadow:0 1px 3px rgba(0,0,0,.9); min-height:2.1em;
}
.screen.empty .screen-sub{color:#fff; opacity:.5; font-size:1rem; text-shadow:none}
.scrub{height:6px; background:rgba(255,255,255,.16)}
.scrub i{display:block; height:100%; width:0; background:var(--sub-ink); transition:width .3s}
@media (prefers-reduced-motion: reduce){.scrub i,.panel > summary::after{transition:none}}

.stats{
  display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin:14px 0 0; padding:0;
  background:var(--line); border:1px solid var(--line); border-radius:10px; overflow:hidden;
}
.stats > div{background:var(--surface); padding:10px 14px; min-width:0}
.stats dt{font-size:.78rem; color:var(--muted); line-height:1.5}
.stats dd{margin:0; font-size:1.2rem; font-weight:700; line-height:1.5; font-variant-numeric:tabular-nums}
@media (max-width:560px){
  .stats{grid-template-columns:1fr 1fr}
}

details.log{margin-top:12px; font-size:.88rem; color:var(--muted)}
details.log ul{margin:8px 0 0; padding-left:18px; max-height:180px; overflow:auto}

/* review */
.legend{display:flex; align-items:center; gap:10px; color:var(--muted); font-size:.9rem; margin:8px 0 0}
.legend::before{content:""; flex:none; width:3px; height:18px; background:var(--todo); border-radius:2px}
.toolbar{display:flex; flex-wrap:wrap; align-items:center; gap:12px; margin-top:16px}
.toolbar input[type=search]{flex:1 1 200px; min-width:0}
.filters{overflow-x:auto}
.viewtoggle{display:none}
.rows{margin-top:14px}
.rows-head{display:none}
.row{
  display:grid; grid-template-columns:minmax(0,1fr); gap:8px 24px;
  padding:14px 0 14px 14px; border-bottom:1px solid var(--line); border-left:3px solid transparent;
  animation:rowIn .32s ease both;
}
@keyframes rowIn{from{opacity:0; transform:translateY(5px)} to{opacity:1; transform:none}}
@media (min-width:720px){.row{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}}
@media (min-width:900px){
  /* split-screen review: toggle between English-above/Sinhala-below and a true two-column layout */
  .viewtoggle{display:inline-flex}
  .rows.split .rows-head{
    display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:8px 24px;
    padding:0 0 10px 14px; margin-bottom:2px; border-bottom:1px solid var(--line);
  }
  .rows.split .rows-head span{font-size:.76rem; font-weight:700; letter-spacing:.03em; color:var(--muted); text-transform:uppercase}
  .rows.split .row{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .rows.stack .row{grid-template-columns:minmax(0,1fr)}
  .rows.stack .rows-head{display:none}
}
.row.todo{border-left-color:var(--todo)}
.row.bad{border-left-color:var(--err)}
.meta{font:.78rem/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--muted)}
.en{color:var(--muted); font-size:.92rem; white-space:pre-line; margin:2px 0 0}
.row textarea{min-height:2.9em; field-sizing:content; resize:vertical; transition:border-color .15s,box-shadow .15s}
.row textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent)}
.acts{display:flex; align-items:center; gap:14px; min-height:34px}
.tag{font-size:.75rem; line-height:1.4; padding:1px 8px; border:1px solid var(--todo); color:var(--todo); border-radius:999px}
.rowsempty{color:var(--muted); padding:18px 0}
@media (prefers-reduced-motion: reduce){.row{animation:none}}

/* small ui-friendliness touches */
.msg[data-kind]{animation:msgIn .25s ease both}
@keyframes msgIn{from{opacity:0; transform:translateY(-3px)} to{opacity:1; transform:none}}
.btn{transition:transform .1s,border-color .15s,filter .15s}
.btn:active:not(:disabled){transform:scale(.97)}
select.flash{animation:selFlash 1s ease}
@keyframes selFlash{0%{box-shadow:0 0 0 0 transparent} 25%{box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 35%, transparent)} 100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.msg[data-kind],select.flash,.btn:active:not(:disabled){animation:none; transform:none}}

/* usage + saved keys */
.usage h3{font-size:1rem; line-height:1.5; margin:24px 0 6px; font-weight:700}
.urow{padding:10px 0; border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.uname{font:600 .86rem/1.5 ui-monospace,Menlo,Consolas,monospace; word-break:break-all}
.uname.sel::after{content:""; display:inline-block; width:6px; height:6px; margin-left:8px; border-radius:50%; background:var(--primary); vertical-align:middle}
.ustat{display:flex; flex-wrap:wrap; gap:2px 16px; font-size:.86rem; color:var(--muted)}
.ustat b{color:var(--ink); font-variant-numeric:tabular-nums}
.uflag{font-size:.84rem; margin-top:2px}
.krow{padding:14px 0; border-top:1px solid var(--line)}
.krow:first-child{border-top:0; padding-top:4px}
.khead{display:flex; flex-wrap:wrap; align-items:center; gap:2px 10px}
.kname{font-weight:600}
.kmask{font:.78rem/1.5 ui-monospace,Menlo,Consolas,monospace; color:var(--muted)}
.badge{font-size:.72rem; line-height:1.5; padding:0 9px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-weight:600}
.kstat{font-size:.88rem; margin-top:2px}
.kuse{font-size:.84rem; color:var(--muted)}
.kacts{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
.kacts .btn{min-height:36px; padding:0 14px; font-size:.86rem}

/* confirm dialog */
dialog{
  width:min(500px,calc(100vw - 32px)); padding:22px; border:1px solid var(--line); border-radius:12px;
  background:var(--surface); color:var(--ink);
}
dialog::backdrop{background:rgba(8,10,24,.55)}
dialog p{margin:0 0 4px}
dialog h2{margin-bottom:2px}
dialog label{margin-top:12px}
dialog .actions{justify-content:flex-end; margin-top:18px}

.ver{max-width:1220px; margin:0 auto; padding:0 24px 28px; color:var(--muted); font:.78rem/1.4 ui-monospace,Menlo,Consolas,monospace}
</style>
</head>
<body>
<a class="skip" href="#workspace" data-i18n="skip"></a>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect class="m-bg" width="32" height="32" rx="8"/><rect class="m-ln" x="6" y="16.5" width="20" height="3.5" rx="1.75"/><rect class="m-ln" x="10" y="22.5" width="12" height="3.5" rx="1.75"/></svg>
    <span>SRT2Si</span>
  </div>
  <div class="tools">
    <div class="seg lang" role="group" aria-label="Language / භාෂාව">
      <button type="button" data-lang="si" lang="si">සිංහල</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <button class="iconbtn" id="themeBtn" type="button"></button>
  </div>
</header>

<div class="layout">
  <aside class="rail" aria-label="Setup">
    <details class="panel" id="s-key" open>
      <summary><span class="n" aria-hidden="true"></span><h2>Gemini API key</h2><span class="sumchip" id="sumKey"></span></summary>
      <div class="body">
        <p class="help" data-i18n-html="key.help"></p>
        <label for="apiKey">API key</label>
        <div class="inline">
          <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
          <button class="btn" id="toggleKey" type="button"></button>
        </div>
        <label class="check" for="remember"><input type="checkbox" id="remember"><span data-i18n="key.remember"></span></label>
        <div class="actions"><button class="btn" id="checkKey" type="button" data-i18n="key.check"></button></div>
        <p class="msg" id="keyMsg" role="status" aria-live="polite"></p>
        <label for="model">Model</label>
        <select id="model"><option value="" data-i18n="model.placeholder"></option></select>
        <p class="help" style="margin-top:8px" data-i18n-html="model.help"></p>
        <p class="help" style="margin-top:10px" data-i18n="key.privacy"></p>
        <div class="usage">
          <h3 data-i18n="usage.h"></h3>
          <div id="usageBody"></div>
          <p class="help" id="usageReset" style="margin-top:8px"></p>
          <p class="help" data-i18n-html="usage.note"></p>
        </div>
      </div>
    </details>

    <details class="panel" id="s-keys">
      <summary><h2 data-i18n="panel.keys"></h2><span class="sumchip" id="sumKeys"></span></summary>
      <div class="body">
        <p class="help" data-i18n="keys.help"></p>
        <div id="keyList"></div>
        <label for="newLabel" data-i18n="keys.name"></label>
        <input id="newLabel" type="text" autocomplete="off" data-i18n-ph="keys.name.ph">
        <label for="newKey" data-i18n="keys.key"></label>
        <input id="newKey" type="password" autocomplete="off" spellcheck="false" placeholder="AIza…">
        <div class="actions"><button class="btn" id="addKey" type="button" data-i18n="keys.add"></button></div>
        <p class="msg" id="keysMsg" role="status" aria-live="polite"></p>
        <p class="help" data-i18n="keys.testnote"></p>
      </div>
    </details>

    <details class="panel" id="s-ctx" open>
      <summary><span class="n" aria-hidden="true"></span><h2 data-i18n="ctx.h2"></h2><span class="sumchip" id="sumCtx"></span></summary>
      <div class="body">
        <p class="help" data-i18n="ctx.help"></p>

        <label for="filmSelect" data-i18n="film.select.label"></label>
        <div class="inline">
          <select id="filmSelect"></select>
          <button class="btn" id="filmLoad" type="button" data-i18n="film.load"></button>
          <button class="btn" id="filmDelete" type="button" data-i18n="film.delete"></button>
        </div>
        <p class="help" id="filmEmpty" data-i18n="film.empty" hidden></p>

        <label for="ctxTitle" data-i18n="ctx.title.label"></label>
        <input id="ctxTitle" type="text" data-i18n-ph="ctx.title.ph">
        <label for="ctxChars" data-i18n="ctx.chars.label"></label>
        <textarea id="ctxChars" data-i18n-ph="ctx.chars.ph"></textarea>
        <label for="ctxNotes" data-i18n="ctx.notes.label"></label>
        <textarea id="ctxNotes" data-i18n-ph="ctx.notes.ph"></textarea>
        <label class="check" for="mixEn"><input type="checkbox" id="mixEn" checked><span data-i18n="ctx.mix"></span></label>

        <label for="filmSaveName" data-i18n="film.save.label"></label>
        <div class="inline">
          <input id="filmSaveName" type="text" data-i18n-ph="film.save.ph">
          <button class="btn primary" id="filmSave" type="button" data-i18n="film.save"></button>
        </div>
        <p class="msg" id="filmMsg" role="status" aria-live="polite"></p>
      </div>
    </details>

    <details class="panel" id="s-adv">
      <summary><h2 data-i18n="panel.adv"></h2></summary>
      <div class="body">
        <div class="grid2">
          <div>
            <label for="chunkSize" data-i18n="file.chunk"></label>
            <input id="chunkSize" type="number" min="10" max="300" value="100" inputmode="numeric">
          </div>
          <div>
            <label for="gap" data-i18n="file.gap"></label>
            <input id="gap" type="number" min="0" max="120" value="4" inputmode="numeric">
          </div>
        </div>
        <div class="grid2">
          <div>
            <label for="temp" data-i18n="file.temp"></label>
            <input id="temp" type="number" min="0" max="1" step="0.1" value="0.3" inputmode="decimal">
          </div>
        </div>
        <p class="help" style="margin-top:10px" data-i18n="file.help"></p>
      </div>
    </details>
  </aside>

  <main class="work" id="workspace">
    <div class="intro">
      <h1 data-i18n="app.title">Sinhala Subtitle Translator</h1>
      <p class="lead" data-i18n="app.lead"></p>
    </div>

    <section class="step" id="s-file">
      <h2><span class="n" aria-hidden="true"></span><span data-i18n="file.h2"></span></h2>
      <label class="drop" id="drop" for="fileInput">
        <input id="fileInput" type="file" accept=".srt,text/plain,application/x-subrip">

<script>
'use strict';

// ==CORE START==
function parseSRT(text) {
  text = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').trim();
  if (!text) return [];
  const out = [];
  for (const block of text.split(/\n{2,}/)) {
    const lines = block.split('\n');
    const ti = lines.findIndex(l => l.indexOf('-->') !== -1);
    if (ti === -1) continue;
    out.push({
      time: lines[ti].trim(),
      lines: lines.slice(ti + 1).map(l => l.trim()).filter(Boolean)
    });
  }
  return out;
}

function buildSRT(entries, tr) {
  return entries.map((e, i) => {
    const id = i + 1;
    const t = tr[id] && String(tr[id]).trim() ? tr[id] : e.lines.join('\n');
    return id + '\n' + e.time + '\n' + t;
  }).join('\n\n') + '\n';
}

function parseModelOutput(text, ids) {
  const allowed = new Set(ids);
  const res = {};
  let cur = null;
  text = String(text || '').replace(/```[a-zA-Z]*\n?/g, '');
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, '');
    const m = line.match(/^\s*(\d+)\s*[|\uFF5C]\s?(.*)$/);
    if (m && allowed.has(+m[1]) && res[+m[1]] === undefined) {
      cur = +m[1];
      res[cur] = m[2].trim();
    } else if (m) {
      cur = null; // a numbered line we did not ask for: stop attaching text to the previous line
    } else if (cur !== null && line.trim() && res[cur].split('\n').length < 3) {
      res[cur] += '\n' + line.trim();
    }
  }
  const out = {};
  for (const k in res) {
    const v = res[k].replace(/ \/ /g, '\n').trim();
    if (v) out[k] = v;
  }
  return out;
}

function retryDelaySeconds(data) {
  const d = (data && data.error && data.error.details) || [];
  for (const x of d) {
    if (x && x.retryDelay) {
      const m = String(x.retryDelay).match(/([\d.]+)s/);
      if (m) return Math.ceil(+m[1]);
    }
  }
  return 0;
}

function buildSystemPrompt(c) {
  const mix = c.mixEnglish
    ? 'Mix in common English words the way Sri Lankans naturally do (Sorry, OK, Boss, Plan, Phone, etc.), written in English letters. Do not force-translate words that nobody says in Sinhala.'
    : 'Prefer Sinhala words. Keep English only for names, brands and technical terms.';
  return [
    'You are a professional Sinhala subtitle translator for films and TV series.',
    '',
    'TASK: Translate the English subtitle lines into natural SPOKEN Sinhala (කතා කරන සිංහල), the way real Sri Lankans talk in a movie. Not bookish/literary Sinhala, and not word-for-word.',
    '',
    'MEANING FIDELITY (highest priority — check this before style):',
    '- Never change a statement into a question, or a question into a statement.',
    '- Never drop or flip a negation. If the English has "never / not / no / n\'t / nothing / nobody", the Sinhala MUST carry that same negative meaning. Do not turn a negative line into an affirmative one.',
    '- Never change who is doing the action, the tense (past/present/future), or add/remove facts that are not in the original English line.',
    '- Natural and "feel-good" phrasing is only allowed as long as the literal meaning stays 100% identical. If a natural phrasing would risk changing the meaning, prefer the slightly more literal (but still spoken, non-bookish) option.',
    '',
    'STYLE RULES:',
    '1. Keep the emotion, humour, sarcasm, anger and slang of each line. Translate the meaning and the feel, not the words — but never at the cost of MEANING FIDELITY above.',
    '2. ' + mix,
    '3. Use colloquial verb endings and particles, and choose ඔයා / උඹ / තමුසේ / ඔබ according to the relationship between the characters (see CONTEXT). Once you pick a form for a character pair, keep using that same form for them for the rest of the file unless CONTEXT says their relationship changes.',
    '4. Write character names in Sinhala script and spell them consistently.',
    '5. Idioms, metaphors and figures of speech: never translate them word-for-word. Re-express the same meaning with a natural Sinhala equivalent, or a plain natural sentence if there is no good equivalent.',
    '6. Carry over emotional emphasis from the English (CAPS, "!", "...", "?!", repeated words) using natural Sinhala means — emphatic particles (ම, නේ, ද, ලු), word order, or punctuation — not by adding new content.',
    '7. Keep each subtitle short: about 42 characters per line at most, and at most 2 lines. Use " / " to mark a line break.',
    '8. Never leave a line empty. Translate sound cues like [door slams] or (laughs) briefly, inside the same brackets.',
    '9. Swearing and insults: match BOTH the intensity and the function of the original — an insult must stay an insult, a threat must stay a threat, dismissal must stay dismissal. Do not substitute a phrase that changes what kind of statement it is (e.g. an insult must not become a threat of violence). Do not sanitize it and do not exaggerate it.',
    '10. Keep HTML tags such as <i></i>, speaker dashes "-" and music symbols exactly as in the original.',
    '11. Write ONLY in Sinhala script, English (Latin) letters, digits and normal punctuation. NEVER output characters from any other script (no Tamil, Bengali, Hindi, Arabic, Burmese, Thai, Korean, Chinese, Japanese).',
    '12. Common English loanwords (alarm, phone, plan, computer, etc.) must be spelled consistently every time they appear — either always as standard Sinhala transliteration (e.g. අලාරම්) or always in English letters per the mix rule above. Never mix spellings of the same word within the file.',

    'Bad (meaning flipped into a question, negation lost): 501|මම කවදාහරි ගිහින්ම තියෙනවද ඉතින්?',

    'Good (natural, spoken, negation kept): 501|මම කවදාවත් එකක ගිහින් නෑ.',
    '',
    'EXAMPLE 2 (sentence continuity across lines):',
    'Input:  426|Yeah, I heard we were taking',
    'Input:  427|a swing at F Corp today, B-Moc.',
    'Bad (427 translated as a standalone sentence, meaning lost): 427|අහුවා මම.',
    'Good (427 continues 426\'s sentence naturally): 426|ඔව්, ඇහුණා අපි අද F Corp එකට ගහනවා කියලා / 427|B-Moc.',
    '',
    'FORMAT RULES (very important):',
    '- Each input line looks like: number|English text   (" / " marks a line break inside one subtitle).',
    '- Output EXACTLY one line for every input line, with the same number and in the same order: number|Sinhala text',
    '- Never merge, split, skip or renumber lines. No explanations, no extra text, no markdown.',
    '',
    'CONTEXT:',
    'Title/genre: ' + (c.title || '(not given)'),
    'Characters and relationships: ' + (c.chars || '(not given)'),
    'Tone / extra notes: ' + (c.notes || '(none)')
  ].join('\n');
}

function buildUserPrompt(entries, tr, ids) {
  const first = Math.min.apply(null, ids);
  const prev = [];
  for (let id = first - 1; id >= 1 && prev.length < 5; id--) {
    if (tr[id] && entries[id - 1].lines.length) prev.unshift(id);
  }
  let s = '';
  if (prev.length) {
    s += 'PREVIOUS LINES (for continuity only. Do NOT translate or output them):\n';
    s += prev.map(id => id + '|' + entries[id - 1].lines.join(' / ') + '  =>  ' + String(tr[id]).replace(/\n/g, ' / ')).join('\n');
    s += '\n\n';
  }
  s += 'LINES TO TRANSLATE:\n';
  s += ids.map(id => id + '|' + entries[id - 1].lines.join(' / ')).join('\n');
  return s;
}

// True if the text contains letters from scripts that should never appear in Sinhala subtitles
// (Tamil, Bengali, Arabic, Myanmar, Thai, Korean, CJK ...). Sinhala (0D80-0DFF) and Latin are allowed.
function hasForeignScript(t) {
  return /[\u0370-\u0D7F\u0E00-\u1DFF\u1F00-\u1FFF\u2E80-\uD7FF\uF900-\uFDFF\uFE70-\uFEFF]/.test(String(t || ''));
}

function chunkArray(arr, n) {
  const out = [];
  for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n));
  return out;
}

// Heuristic: does entry `id` look like it continues the spoken sentence of entry `id-1`?
// (previous line doesn't end with sentence punctuation, and this line doesn't start with a capital)
function looksLikeContinuation(entries, id) {
  if (id < 2) return false;
  const prevE = entries[id - 2], curE = entries[id - 1];
  if (!prevE || !curE || !prevE.lines.length || !curE.lines.length) return false;
  const prevText = prevE.lines.join(' ').replace(/<[^>]+>/g, '').trim();
  const curText = curE.lines.join(' ').replace(/<[^>]+>/g, '').trim().replace(/^[-\u2013\u2014"'(\[]+/, '');
  if (!prevText || !curText) return false;
  const endsWithTerminator = /[.!?\u2026"'\)\]]\s*$/.test(prevText);
  const startsLower = /^[a-z]/.test(curText);
  return !endsWithTerminator && startsLower;
}

// Like chunkArray, but avoids cutting an API-call boundary in the middle of a split sentence:
// if the line right after a proposed chunk boundary looks like a continuation of the chunk's
// last line, pull it (and up to a few more) into the same chunk so the model sees the full sentence.
function chunkArraySmart(ids, n, entries) {
  const out = [];
  let i = 0;
  while (i < ids.length) {
    let end = Math.min(i + n, ids.length);
    let extended = 0;
    while (end < ids.length && extended < 5) {
      const lastId = ids[end - 1], nextId = ids[end];
      if (nextId === lastId + 1 && looksLikeContinuation(entries, nextId)) { end++; extended++; }
      else break;
    }
    out.push(ids.slice(i, end));
    i = end;
  }
  return out;
}

function hashStr(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

/* ---------- usage tracking (Pacific day = when Google resets the daily quota) ---------- */
function loadKeys() {
  try { KEYS = JSON.parse(store.get('srt2si:keys', '[]')) || []; } catch (e) { KEYS = []; }
  try { USAGE = JSON.parse(store.get('srt2si:usage', '{}')) || {}; } catch (e) { USAGE = {}; }
}
function saveKeys() { store.set('srt2si:keys', JSON.stringify(KEYS)); }
function saveUsage() { store.set('srt2si:usage', JSON.stringify(USAGE)); }
function keyFp(k) { return 'k' + hashStr(k); }
function pacificParts(ms) {
  const p = {};
  new Intl.DateTimeFormat('en-US', { timeZone: 'America/Los_Angeles', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' })
    .formatToParts(new Date(ms)).forEach(x => { p[x.type] = x.value; });
  return p;
}
function pacificDay(ms) { const p = pacificParts(ms); return p.year + '-' + p.month + '-' + p.day; }
function pacificSinceMidnight(ms) {
  const p = pacificParts(ms);
  return ((+p.hour * 60 + +p.minute) * 60 + +p.second) * 1000 + (ms % 1000);
}
function nextPacificReset(ms) {
  let c = ms + 86400000 - pacificSinceMidnight(ms);
  for (let i = 0; i < 3; i++) { // fix the 23h / 25h days around daylight saving changes
    const s = pacificSinceMidnight(c);
    if (s === 0) break;
    c = s < 43200000 ? c - s : c + 86400000 - s;
  }
  return c;
}
function fmtClock(ts) { return new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtStamp(ts) {
  const d = new Date(ts), n = new Date();
  if (d.toDateString() === n.toDateString()) return fmtClock(ts);
  return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function fmtNum(n) { return Number(n || 0).toLocaleString(); }

function usageRec(fp, create) {
  const day = pacificDay(Date.now());
  let r = USAGE[fp];
  if (!r) { r = { day: day, m: {}, exh: {} }; if (create) USAGE[fp] = r; return r; } // reading never stores a record
  if (r.day !== day) { r.day = day; r.m = {}; r.exh = {}; } // a new Pacific day: the daily quota has reset
  return r;
}
function exhausted(r, model) {
  const x = r.exh[model];
  return x && x.until > Date.now() ? x : null;
}
function trackUse(key, model, d) {
  if (!key || !model) return;
  const r = usageRec(keyFp(key), true);
  const m = r.m[model] || (r.m[model] = { req: 0, tin: 0, tout: 0, lines: 0 });
  m.req += d.req || 0; m.tin += d.tin || 0; m.tout += d.tout || 0; m.lines += d.lines || 0;
  if (d.req) { r.lastOk = Date.now(); r.invalid = false; delete r.exh[model]; } // a request went through
  saveUsage(); renderUsage();
}
function markExhausted(key, model, kind) {
  if (!key || !model) return;
  const r = usageRec(keyFp(key), true);
  r.exh[model] = { until: nextPacificReset(Date.now()), kind: kind };
  r.lastExh = r.exh[model].until;
  saveUsage(); renderUsage();
}
function markInvalid(key) {
  if (!key) return;
  usageRec(keyFp(key), true).invalid = true;
  saveUsage(); renderUsage();
}
function markOk(key) {
  if (!key) return;
  const r = usageRec(keyFp(key), true);
  r.invalid = false; r.lastOk = Date.now();
  saveUsage(); renderUsage();
}
function classify429(data, message) {
  const raw = JSON.stringify(data || {});
  if (/"quotaValue":"0"/.test(raw) || /limit:\s*0\b/.test(String(message))) return 'none';
  if (/PerDay/.test(raw) && !/PerMinute/.test(raw)) return 'daily';
  return 'rate';
}

async function loadModels() {

  try {
    const res = await fetch(API + '/models?pageSize=1000', { headers: { 'x-goog-api-key': key } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error((data.error && data.error.message) || res.statusText); e.status = res.status; throw e; }
    const score = n => (/lite/.test(n) ? 0 : /flash/.test(n) ? 1 : /pro/.test(n) ? 3 : 2) + (/preview|exp/.test(n) ? 0.5 : 0);
    const names = (data.models || [])
      .filter(m => (m.supportedGenerationMethods || []).indexOf('generateContent') !== -1)
      .map(m => m.name.replace(/^models\//, ''))
      .filter(n => !/image|tts|live|audio|embedding|aqa|robotics|computer|imagen|veo|learnlm/i.test(n))
      .sort((a, b) => score(a) - score(b) || b.localeCompare(a));
    if (!names.length) { setKeyMsg('key.nomodels', null, 'err'); return false; }
    const prev = $('model').value || store.get('srt2si:model', '');
    S.modelNames = names;

  } catch (e) {

    else setKeyMsg('key.fail', { msg: e.message }, 'err');

  }
}

async function callGemini(model, system, user, temperature) {
  const key = $('apiKey').value.trim();
  S.lastReq = Date.now();
  S.abort = new AbortController();
  const res = await fetch(API + '/models/' + encodeURIComponent(model) + ':generateContent', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      systemInstruction: { parts: [{ text: system }] },
      contents: [{ role: 'user', parts: [{ text: user }] }],
      generationConfig: { temperature: temperature },
      safetySettings: ['HARM_CATEGORY_HARASSMENT', 'HARM_CATEGORY_HATE_SPEECH', 'HARM_CATEGORY_SEXUALLY_EXPLICIT', 'HARM_CATEGORY_DANGEROUS_CONTENT']
        .map(c => ({ category: c, threshold: 'BLOCK_NONE' }))
    }),
    signal: S.abort.signal
  });
  S.lastReq = Date.now();
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const e = new Error((data.error && data.error.message) || res.statusText);
    e.status = res.status; e.data = data;
    throw e;
  }
  const um = data.usageMetadata || {};
  trackUse(key, model, { req: 1, tin: um.promptTokenCount || 0, tout: Math.max(0, (um.totalTokenCount || 0) - (um.promptTokenCount || 0)) || um.candidatesTokenCount || 0 });
  const cand = data.candidates && data.candidates[0];
  const text = ((cand && cand.content && cand.content.parts) || []).map(p => p.text || '').join('');
  return { text, finish: cand && cand.finishReason, blocked: data.promptFeedback && data.promptFeedback.blockReason };
}

async function requestWithRetry(fn) {
  for (let attempt = 0; attempt < 6; attempt++) {
    if (S.stop) throw new Error('stopped');
    try {
      return await fn();
    } catch (e) {
      if (S.stop || e.name === 'AbortError') throw new Error('stopped');
      if ([400, 401, 403, 404].indexOf(e.status) !== -1) { e.fatal = true; throw e; }
      let wait;
      if (e.status === 429) {
        const raw = JSON.stringify(e.data || {});
        const quotas = (raw.match(/"quotaId":"[^"]+"/g) || []).map(x => x.slice(11, -1)).join(', ');
        log('429: ' + String(e.message || '').slice(0, 300) + (quotas ? ' | ' + quotas : ''));
        if (/"quotaValue":"0"/.test(raw) || /limit:\s*0\b/.test(String(e.message))) { e.noQuota = true; throw e; }
        if (/PerDay/.test(raw) && !/PerMinute/.test(raw)) { e.daily = true; throw e; }
        wait = retryDelaySeconds(e.data) || Math.min(60, 15 * (attempt + 1));
        log(t('log.429', { s: wait }));
        await waitSeconds(wait + 1, 'run.limitwait');
      } else if (e.status >= 500 || e.name === 'TypeError') {
        wait = 5 * (attempt + 1);
        log(t('log.err', { msg: e.message, s: wait }));
        await waitSeconds(wait, 'run.neterr');
      } else {
        throw e;
      }
    }
  }
  throw new Error(t('run.retriesfail'));
}

async function translatePart(ids, attempt) {
  await gapWait();
  if (S.stop) throw new Error('stopped');
  const model = $('model').value.trim();
  const sys = buildSystemPrompt(getCtx());
  const usr = buildUserPrompt(S.entries, S.tr, ids);
  setStatus('run.progress', { a: ids[0], b: ids[ids.length - 1] });
  const base = Math.min(1, Math.max(0, isNaN(parseFloat($('temp').value)) ? 0.3 : parseFloat($('temp').value)));
  const temperature = attempt > 0 ? Math.min(base, 0.1) : base;
  const r = await requestWithRetry(() => callGemini(model, sys, usr, temperature));
  if (r.blocked) log('Blocked: ' + r.blocked);
  const got = parseModelOutput(r.text, ids);
  let n = 0, last = 0, foreign = 0;
  for (const k in got) {
    if (hasForeignScript(got[k])) { foreign++; continue; } // garbled output: leave it untranslated so it is retried
    S.tr[k] = got[k]; setRow(+k); n++; last = Math.max(last, +k);
  }
  if (foreign) log(t('log.foreign', { n: foreign }));
  if (n) trackUse($('apiKey').value.trim(), model, { lines: n });
  if (last) showNow(last);
  save(); updateProgress(); applyFilter();
  if (n < ids.length) log(t('log.missing', { n: ids.length - n, why: (r.finish && r.finish !== 'STOP') ? ' (' + r.finish + ')' : '' }));
  return n;
}

async function translateBatch(ids) {
  let pending = ids.slice();
  for (let attempt = 0; attempt < 4 && pending.length; attempt++) {
    const size = attempt === 0 ? pending.length : Math.max(8, Math.ceil(pending.length / (attempt + 1)));
    for (const part of chunkArray(pending, size)) await translatePart(part, attempt);
    pending = pending.filter(id => !S.tr[id]);
  }
  if (pending.length) log(t('log.failed', { n: pending.length }));
}

// run(null) translates every remaining line; run([ids]) translates only those lines
async function run(only) {
  if (S.running) return;
  if (!$('apiKey').value.trim()) { setStatus('run.needKey', null, 'err'); $('apiKey').focus(); return; }
  if (!S.entries.length) { setStatus('run.needFile', null, 'err'); return; }
  saveSettings();
  if (!$('model').value.trim()) {
    const ok = await loadModels();
    if (!ok || !$('model').value.trim()) { setStatus('run.nomodel', null, 'err'); return; }
  }
  const todo = only || todoIds();
  if (!todo.length) { setStatus('run.alldone', null, 'ok'); return; }
  const size = Math.min(300, Math.max(10, parseInt($('chunkSize').value, 10) || 100));
  S.stop = false; S.runIds = todo.slice(); S.t0 = Date.now(); S.d0 = doneCount();
  S.runKey = $('apiKey').value.trim(); S.runModel = $('model').value.trim();
  setBusy(true);
  try {
    for (const batch of chunkArraySmart(todo, size, S.entries)) await translateBatch(batch);
    const left = only ? only.filter(id => !S.tr[id]).length : todoIds().length;
    if (!left) setStatus('run.finished', null, 'ok');
    else setStatus('run.left', { n: left }, 'err');
  } catch (e) {
    if (e.message === 'stopped') setStatus('run.stopped');
    else if (e.daily) { markExhausted(S.runKey, S.runModel, 'daily'); setStatus('run.daily', { time: fmtClock(nextPacificReset(Date.now())) }, 'err'); }
    else if (e.noQuota) { markExhausted(S.runKey, S.runModel, 'none'); setStatus('run.noquota', null, 'err'); }
    else if (e.fatal && e.status === 404) setStatus('run.model404', null, 'err');
    else if (e.fatal) {
      if (e.status === 401 || e.status === 403 || /api key/i.test(String(e.message))) markInvalid(S.runKey);
      setStatus('run.fatal', { msg: e.message }, 'err');
    }
    else setStatus('run.error', { msg: e.message }, 'err');
    log('Stopped: ' + e.message);
  } finally {
    save(); setBusy(false); applyFilter();
  }
}
function start() { return run(null); }

async function retranslate(id) {
  if (S.running) return;
  if (!$('apiKey').value.trim()) { setStatus('run.needKey', null, 'err'); $('apiKey').focus(); return; }
  const prev = S.tr[id];
  delete S.tr[id]; setRow(id); save(); updateProgress();
  await run([id]);
  if (!S.tr[id] && prev) {
    S.tr[id] = prev; setRow(id); save(); updateProgress();
    setStatus('row.kept', null, 'err');
  }
}

function stop() {
  S.stop = true;
  if (S.abort) S.abort.abort();
}

function defaultOutName() { return (S.fileName || 'subtitles').replace(/\.srt$/i, '') + '.si.srt'; }
function cleanName(n) {
  n = String(n || '').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '').trim().replace(/[. ]+$/, '');
  if (!n) return '';
  return /\.srt$/i.test(n) ? n : n + '.srt';
}
// resolves to the chosen file name, the default name (skip), or null (cancelled)
function askName(def) {
  const d = $('nameDlg'), inp = $('outName');
  if (typeof d.showModal !== 'function') return Promise.resolve(def);
  inp.value = def;
  $('nameNo').textContent = t('dlg.cancel');
  $('nameSkip').textContent = t('name.skip');
  $('nameYes').textContent = t('dl.ok');
  d.returnValue = '';
  return new Promise(res => {
    d.addEventListener('close', () => {
      if (d.returnValue === 'ok') res(cleanName(inp.value) || def);
      else if (d.returnValue === 'skip') res(def);
      else res(null);
    }, { once: true });
    d.showModal();
    inp.focus();
    inp.setSelectionRange(0, def.replace(/\.srt$/i, '').length); // select the name, keep the extension
  });
}

async function download() {
  const total = translatable(), d = doneCount();
  if (d < total && !(await ask(t('dl.confirm', { n: total - d }), 'dl.ok'))) return;
  const name = await askName(defaultOutName());
  if (name === null) return;
  const srt = buildSRT(S.entries, S.tr).replace(/\n/g, '\r\n');
  const blob = new Blob(['\uFEFF' + srt], { type: 'application/x-subrip;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

async function clearProgress() {
  if (!S.entries.length || !(await ask(t('clear.confirm'), 'clear.ok'))) return;
  S.tr = {}; store.del(S.fp);
  resetNow(); setStatus(null);
  renderRows(); updateProgress();
}

/* ---------- usage panel + saved keys ---------- */
function setKeysMsg(key, vars, kind) { S.kmsg = key ? { key, vars, kind } : null; renderKeysMsg(); }
function renderKeysMsg() {
  const s = $('keysMsg');
  s.textContent = S.kmsg ? t(S.kmsg.key, S.kmsg.vars) : '';
  s.dataset.kind = (S.kmsg && S.kmsg.kind) || '';
}
// rebuild a container only when its content really changed, so keyboard focus is not lost on timer refreshes
function swapIfChanged(box, build) {
  const tmp = document.createElement('div');
  build(tmp);
  if (tmp.innerHTML === box.innerHTML) return;
  box.textContent = '';
  while (tmp.firstChild) box.appendChild(tmp.firstChild);
}
function maskKey(k) { return k.length > 10 ? k.slice(0, 4) + '…' + k.slice(-4) : '…'; }
function sumTokens(m) { return (m.tin || 0) + (m.tout || 0); }

function renderUsage() {
  const key = $('apiKey').value.trim(), model = $('model').value;
  swapIfChanged($('usageBody'), box => {
    if (!key) { const p = el('p', 'help'); p.textContent = t('usage.nokey'); box.appendChild(p); return; }
    const r = usageRec(keyFp(key));
    const names = Object.keys(r.m);
    if (model && names.indexOf(model) === -1) names.unshift(model);
    if (!names.length) { const p = el('p', 'help'); p.textContent = t('usage.empty'); box.appendChild(p); return; }
    names.forEach(n => {
      const m = r.m[n] || { req: 0, tin: 0, tout: 0, lines: 0 };
      const ex = exhausted(r, n);
      const row = el('div', 'urow');
      const nm = el('div', 'uname' + (n === model ? ' sel' : '')); nm.textContent = n;
      const st = el('div', 'ustat');
      [['usage.req', m.req], ['usage.tok', sumTokens(m)], ['usage.lines', m.lines]].forEach(x => {
        const sp = el('span'); sp.appendChild(document.createTextNode(t(x[0]) + ' '));
        const b = el('b'); b.textContent = fmtNum(x[1]); sp.appendChild(b); st.appendChild(sp);
      });
      const fl = el('div', 'uflag');
      if (ex) { fl.dataset.kind = 'err'; fl.textContent = t(ex.kind === 'none' ? 'usage.none' : 'usage.exh', { time: fmtClock(ex.until) }); }
      else if (m.req) { fl.dataset.kind = 'ok'; fl.textContent = t('usage.ok'); }
      row.appendChild(nm); row.appendChild(st); if (fl.textContent) row.appendChild(fl);
      box.appendChild(row);
    });
  });
  const rs = $('usageReset');
  if (!key) rs.textContent = '';
  else {
    const next = nextPacificReset(Date.now());
    rs.textContent = t('usage.reset', { time: fmtClock(next), left: fmtDuration(Math.max(60, Math.round((next - Date.now()) / 60000) * 60)) });
  }
  renderKeyList();
}

function keyStatus(k) {
  const r = usageRec(keyFp(k.key)), model = $('model').value;
  if (r.invalid) return { kind: 'err', text: t('ks.invalid') };
  const ex = model ? exhausted(r, model) : null;
  if (ex) return { kind: 'err', text: t(ex.kind === 'none' ? 'ks.none' : 'ks.exh', { time: fmtClock(ex.until) }) };
  if (r.lastExh && r.lastExh <= Date.now() && (!r.lastOk || r.lastOk < r.lastExh)) return { kind: '', text: t('ks.reset') };
  if (r.lastOk) return { kind: 'ok', text: t('ks.ok', { time: fmtStamp(r.lastOk) }) };
  return { kind: '', text: t('ks.unknown') };
}

function renderKeyList() {
  const cur = $('apiKey').value.trim(), curFp = cur ? keyFp(cur) : '', model = $('model').value;
  $('sumKeys').textContent = t(KEYS.length ? 'keys.count' : 'keys.none', { n: KEYS.length });
  swapIfChanged($('keyList'), box => {
    if (!KEYS.length) { const p = el('p', 'help'); p.textContent = t('keys.empty'); box.appendChild(p); return; }
    KEYS.forEach(k => {
      const fp = keyFp(k.key), r = usageRec(fp), isCur = fp === curFp;
      const row = el('div', 'krow');
      const head = el('div', 'khead');
      const nm = el('span', 'kname'); nm.textContent = k.label;
      const mk = el('span', 'kmask'); mk.textContent = maskKey(k.key);
      head.appendChild(nm); head.appendChild(mk);
      if (isCur) { const b = el('span', 'badge'); b.textContent = t('keys.active'); head.appendChild(b); }
      row.appendChild(head);
      const tst = TEST[fp];
      const stt = tst && tst.text ? { kind: tst.kind, text: tst.text } : keyStatus(k);
      const st = el('div', 'kstat'); st.dataset.kind = stt.kind; st.textContent = stt.text;
      row.appendChild(st);
      let req = 0, tok = 0, others = 0;
      Object.keys(r.m).forEach(n => { req += r.m[n].req; tok += sumTokens(r.m[n]); });
      Object.keys(r.exh).forEach(n => { if (n !== model && exhausted(r, n)) others++; });
      const us = el('div', 'kuse');
      us.textContent = t('ks.today', { req: fmtNum(req), tok: fmtNum(tok) }) + (others ? '  ·  ' + t('ks.others', { n: others }) : '');
      row.appendChild(us);
      const acts = el('div', 'kacts');
      const use = el('button', 'btn'); use.type = 'button'; use.textContent = t('keys.use'); use.disabled = isCur || S.running;
      use.addEventListener('click', () => useKey(k));
      const tb = el('button', 'btn'); tb.type = 'button'; tb.textContent = t('keys.test'); tb.disabled = !!(tst && tst.busy);
      tb.addEventListener('click', () => testKey(k));
      const rm = el('button', 'btn'); rm.type = 'button'; rm.textContent = t('keys.remove');
      rm.addEventListener('click', () => removeKey(k));
      acts.appendChild(use); acts.appendChild(tb); acts.appendChild(rm);
      row.appendChild(acts);
      box.appendChild(row);
    });
  });
}

function addKey() {
  const key = $('newKey').value.trim(), label = $('newLabel').value.trim();
  if (!key) { setKeysMsg('keys.err.empty', null, 'err'); return; }
  const dup = KEYS.filter(k => keyFp(k.key) === keyFp(key))[0];
  if (dup) { setKeysMsg('keys.err.dup', { name: dup.label }, 'err'); return; }
  KEYS.push({ label: label || ('Key ' + (KEYS.length + 1)), key: key, added: Date.now() });
  saveKeys();
  $('newKey').value = ''; $('newLabel').value = '';
  setKeysMsg('keys.added', null, 'ok');
  renderUsage();
}
function useKey(k) {
  if (S.running) return;
  $('apiKey').value = k.key;
  saveSettings();
  loadModels();
}
async function removeKey(k) {
  if (!(await ask(t('keys.remove.confirm', { name: k.label }), 'keys.remove.ok'))) return;
  KEYS = KEYS.filter(x => x !== k);
  if (keyFp(k.key) !== keyFp($('apiKey').value.trim())) { delete USAGE[keyFp(k.key)]; saveUsage(); }
  saveKeys(); renderUsage();
}
async function testKey(k) {
  const fp = keyFp(k.key), model = $('model').value;
  TEST[fp] = { text: t('key.checking'), kind: '', busy: true };
  renderKeyList();
  const done = (text, kind) => { TEST[fp] = { text: text, kind: kind }; setTimeout(() => { delete TEST[fp]; renderKeyList(); }, 20000); };
  try {
    const res = await fetch(API + '/models?pageSize=1000', { headers: { 'x-goog-api-key': k.key } });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { const e = new Error((data.error && data.error.message) || res.statusText); e.status = res.status; throw e; }
    markOk(k.key);
    const names = (data.models || []).map(m => m.name.replace(/^models\//, ''));
    if (!model || names.indexOf(model) === -1) { done(t('test.keyok'), 'ok'); return; }
    const r2 = await fetch(API + '/models/' + encodeURIComponent(model) + ':generateContent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-goog-api-key': k.key },
      body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: 'hi' }] }], generationConfig: { maxOutputTokens: 1 } })
    });
    const d2 = await r2.json().catch(() => ({}));
    if (r2.ok) {
      const um = d2.usageMetadata || {};
      trackUse(k.key, model, { req: 1, tin: um.promptTokenCount || 0, tout: Math.max(0, (um.totalTokenCount || 0) - (um.promptTokenCount || 0)) });
      done(t('test.ok', { model: model }), 'ok');
    } else if (r2.status === 429) {
      const kind = classify429(d2, d2.error && d2.error.message);
      if (kind === 'rate') done(t('test.rate'), 'err');
      else { markExhausted(k.key, model, kind); done('', ''); }
    } else {
      const e = new Error((d2.error && d2.error.message) || r2.statusText); e.status = r2.status; throw e;
    }
  } catch (e) {
    if (e.status === 400 || e.status === 403) { markInvalid(k.key); done('', ''); }
    else done(t('test.fail', { msg: e.message }), 'err');
  } finally {
    if (TEST[fp] && TEST[fp].busy) delete TEST[fp];
    renderKeyList();
  }
}

/* ---------- wiring ---------- */
loadSettings();
loadKeys();
loadFilms();
renderFilmSelect();
onFilmSelectChange();
if (window.matchMedia && window.matchMedia('(max-width:899px)').matches) {
  $('s-ctx').open = false;
  if ($('apiKey').value.trim()) $('s-key').open = false; // remembered key: less scrolling on phones
}
[...FIELDS, 'mixEn', 'remember', 'apiKey', 'model'].forEach(f => $(f).addEventListener('input', saveSettings));
$('model').addEventListener('change', saveSettings);
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
$('themeBtn').addEventListener('click', cycleTheme);
$('viewStack').addEventListener('click', () => setView('stack'));
$('viewSplit').addEventListener('click', () => setView('split'));
setView(store.get('srt2si:view', 'split'));
$('toggleKey').addEventListener('click', () => {
  const k = $('apiKey');
  k.type = k.type === 'password' ? 'text' : 'password';
  $('toggleKey').textContent = t(k.type === 'password' ? 'key.show' : 'key.hide');
});
$('checkKey').addEventListener('click', loadModels);
$('fileInput').addEventListener('change', e => { handleFile(e.target.files[0]); e.target.value = ''; });
const dz = $('drop');
['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
dz.addEventListener('drop', e => handleFile(e.dataTransfer.files[0]));
$('start').addEventListener('click', start);
$('stop').addEventListener('click', stop);
$('download').addEventListener('click', download);
$('nameNo').addEventListener('click', () => $('nameDlg').close('cancel'));
$('nameSkip').addEventListener('click', () => $('nameDlg').close('skip'));
$('clear').addEventListener('click', clearProgress);
$('scan').addEventListener('click', scanBad);
$('q').addEventListener('input', applyFilter);
$('addKey').addEventListener('click', addKey);
$('newKey').addEventListener('keydown', e => { if (e.key === 'Enter') addKey(); });
$('filmSelect').addEventListener('change', onFilmSelectChange);
$('filmLoad').addEventListener('click', loadSelectedFilm);
$('filmDelete').addEventListener('click', deleteSelectedFilm);
$('filmSave').addEventListener('click', saveFilmAs);
$('filmSaveName').addEventListener('keydown', e => { if (e.key === 'Enter') saveFilmAs(); });
$('filmSaveName').addEventListener('input', updateFilmSaveBtn);
setInterval(renderUsage, 30000); // keeps the reset countdown fresh, and notices when the Pacific day changes
document.querySelectorAll('.filters button').forEach(b => b.addEventListener('click', () => {
  S.filter = b.dataset.f;
  document.querySelectorAll('.filters button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyFilter();
}));
window.addEventListener('beforeunload', save);
applyLang();
if ($('apiKey').value.trim()) loadModels(); // a remembered key: have the model list ready
</script>
